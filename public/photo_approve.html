<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SMART Mission Race | 모바일 사진 승인</title>
    <link rel="stylesheet" href="./css/photo_approve.css" />
  </head>
  <body>
    <div class="approve-shell">
      <header class="approve-header">
        <div>
          <h1 id="approveTitle">모바일 사진 승인</h1>
          <p id="approveSubtitle">프로젝트를 불러오는 중입니다.</p>
        </div>
        <button type="button" class="approve-btn approve-btn--ghost" id="approveOpenReviewBtn">검수 화면</button>
      </header>

      <section class="approve-topbar">
        <div class="approve-count" id="approveQueueCount">대기 0건</div>
        <div class="approve-filters">
          <button type="button" class="approve-chip is-active" data-approve-filter="pending">대기</button>
          <button type="button" class="approve-chip" data-approve-filter="retry">재도전</button>
          <button type="button" class="approve-chip" data-approve-filter="all">전체</button>
        </div>
      </section>

      <main class="approve-main">
        <section class="approve-card">
          <div class="approve-card__head">
            <strong id="approveTeamLabel">팀을 불러오는 중입니다.</strong>
            <span class="approve-badge" id="approveMissionLabel">미션 -</span>
          </div>
          <div class="approve-meta" id="approveMeta">업로드된 사진을 불러오는 중입니다.</div>
          <div class="approve-context" id="approveContext"></div>
          <div class="approve-preview" id="approvePreview">사진이 없으면 여기에 표시됩니다.</div>
          <div class="approve-slots" id="approveSlots"></div>
          <div class="approve-history">
            <div class="approve-history__head">
              <strong>최근 처리</strong>
              <span id="approveHistoryCount">0건</span>
            </div>
            <div class="approve-history__list" id="approveHistory"></div>
          </div>
        </section>
      </main>

      <div class="approve-bottom">
        <button type="button" class="approve-btn approve-btn--ghost" id="approvePrevBtn">이전</button>
        <button type="button" class="approve-btn approve-btn--warn" id="approveRetryBtn">재도전</button>
        <button type="button" class="approve-btn approve-btn--primary" id="approveOkBtn">승인</button>
        <button type="button" class="approve-btn approve-btn--ghost" id="approveNextBtn">다음</button>
      </div>
    </div>
    <div class="approve-toast-host" id="approveToastHost"></div>

    <div class="approve-lock" id="approveLock">
      <div class="approve-lock__panel">
        <h2>모바일 사진 승인 잠금</h2>
        <p id="approveLockMessage">이 프로젝트의 모바일 사진 승인은 전용 비밀번호가 필요합니다.</p>
        <input id="approveLockInput" type="password" placeholder="승인 비밀번호" />
        <div class="approve-lock__actions">
          <button type="button" class="approve-btn approve-btn--ghost" id="approveLockReviewBtn">검수 화면 열기</button>
          <button type="button" class="approve-btn approve-btn--primary" id="approveLockSubmit">입장</button>
        </div>
      </div>
    </div>

    <div class="approve-modal" id="approveRetryModal" hidden>
      <div class="approve-modal__panel" role="dialog" aria-modal="true" aria-labelledby="approveRetryTitle">
        <div class="approve-modal__head">
          <h2 id="approveRetryTitle">재도전 요청</h2>
          <button type="button" class="approve-btn approve-btn--ghost approve-btn--icon" id="approveRetryClose">×</button>
        </div>
        <p class="approve-modal__meta" id="approveRetryMeta">재도전 사유를 입력하세요.</p>
        <div class="approve-presets">
          <button type="button" class="approve-chip" data-approve-retry-preset="사진이 흐려 다시 촬영해 주세요.">흐림</button>
          <button type="button" class="approve-chip" data-approve-retry-preset="미션 장소가 잘 보이도록 다시 촬영해 주세요.">장소 확인</button>
          <button type="button" class="approve-chip" data-approve-retry-preset="참가 인원이 모두 보이도록 다시 촬영해 주세요.">인원 확인</button>
          <button type="button" class="approve-chip" data-approve-retry-preset="지시사항에 맞게 다시 촬영해 주세요.">다시 촬영</button>
        </div>
        <textarea id="approveRetryInput" rows="5" placeholder="재도전 사유를 입력하세요."></textarea>
        <div class="approve-modal__actions">
          <button type="button" class="approve-btn approve-btn--ghost" id="approveRetryCancel">취소</button>
          <button type="button" class="approve-btn approve-btn--warn" id="approveRetrySubmit">전송</button>
        </div>
      </div>
    </div>

    <script type="module" src="./js/photo_approve.js"></script>
  </body>
</html>
