<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📸 미션 사진 업로드</title>
  <style>
    body {
      background: #0b1522;
      color: #fff;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      text-align: center;
      gap: 18px;
    }
    h2 {
      margin: 0;
      color: #4cc9f0;
      font-size: 28px;
    }
    #teamInfo {
      font-size: 16px;
      color: #d1d5db;
    }
    .photo-layout {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 760px;
      align-items: flex-start;
    }
    .photo-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }
    .photo-column--special {
      flex: 1;
    }
    .photo-column--special strong {
      color: #facc15;
    }
    .photo-slot {
      background: rgba(255,255,255,0.08);
      padding: 12px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }
    .photo-slot--retry {
      box-shadow: 0 0 0 2px rgba(249,115,22,0.8), 0 8px 22px rgba(249,115,22,0.35);
    }
    .photo-slot strong {
      font-size: 16px;
    }
    .slot-status {
      font-size: 12px;
      color: #94a3b8;
    }
    .slot-status--pending { color: #facc15; }
    .slot-status--retry { color: #f97316; }
    .slot-status--approved { color: #22c55e; }
    .upload-btn {
      background: #4cc9f0;
      color: #fff;
      border-radius: 6px;
      padding: 8px 0;
      width: 100%;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
      text-align: center;
    }
    .upload-btn:hover {
      background: #3aa6d8;
      transform: translateY(-1px);
    }
    .upload-btn--retry {
      background: #f97316;
    }
    .upload-btn--notify {
      position: relative;
    }
    .upload-btn--notify::after {
      content: "!";
      position: absolute;
      top: -8px;
      right: 10px;
      background: #f97316;
      color: #0b1522;
      font-size: 11px;
      font-weight: 700;
      border-radius: 999px;
      padding: 2px 6px;
      box-shadow: 0 0 12px rgba(249,115,22,0.6);
    }
    .photo-slot input {
      display: none;
    }
    .preview {
      width: 100%;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15,23,42,0.85);
      border-radius: 8px;
      overflow: hidden;
    }
    .preview img,
    .preview video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .alert-area {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 999;
    }
    .alert-toast {
      background: rgba(15,23,42,0.95);
      border: 1px solid rgba(148,163,184,0.4);
      border-radius: 10px;
      padding: 12px 14px;
      min-width: 240px;
      text-align: left;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
      animation: fadeIn 0.2s ease;
    }
    .alert-toast--warning {
      border-color: rgba(249,115,22,0.6);
    }
    .alert-toast strong {
      display: block;
      font-size: 13px;
      color: #facc15;
      margin-bottom: 4px;
    }
    .upload-status {
      margin: 18px auto;
      padding: 14px 18px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(76,201,240,0.15), rgba(15,23,42,0.85));
      border: 1px solid rgba(76,201,240,0.45);
      font-size: 15px;
      color: #f1f5f9;
      min-height: 48px;
      width: min(640px, 95%);
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    .upload-status strong {
      font-size: 18px;
      color: #facc15;
      display: block;
      margin-bottom: 4px;
    }
    .slot-retry-note {
      font-size: 12px;
      color: #f97316;
      margin-top: 4px;
      display: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 640px) {
      .photo-layout {
        flex-direction: column;
      }
      .alert-area {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
      }
    }
  </style>
</head>
<body>
  <h2>미션 사진 업로드</h2>
  <p id="teamInfo"></p>
  <div class="upload-status" id="uploadStatus"></div>
  <div class="photo-layout">
    <div class="photo-column" id="photoColumnLeft"></div>
    <div class="photo-column photo-column--special" id="photoColumnRight"></div>
  </div>
  <div class="alert-area" id="uploadAlerts"></div>

  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.3/dist/heic2any.min.js"></script>
  <script type="module">
    import {
      db,
      storage,
      ref,
      set,
      onValue,
      sRef,
      uploadBytes,
      getDownloadURL,
      get,
      push,
      serverTimestamp,
    } from "./js/firebase_config.js";

    const params = new URLSearchParams(window.location.search);
    const projectId = params.get("project") || "default";
    const teamId = params.get("team") || "Team1";
    const missionId = params.get("mission") || "1";

    const infoEl = document.getElementById("teamInfo");
    infoEl.textContent = `${projectId} · ${teamId} | Mission ${missionId}`;
    const titleEl = document.querySelector("h2");
    if (titleEl) {
      titleEl.textContent = `${teamId} · Mission ${missionId} 사진 업로드`;
    }

    const leftColumn = document.getElementById("photoColumnLeft");
    const rightColumn = document.getElementById("photoColumnRight");
    const alertArea = document.getElementById("uploadAlerts");
    const slotElements = new Map();
    const slotStateCache = new Map();
    let slotDefinitions = [];
    const statusBanner = document.getElementById("uploadStatus");
    let approvalNotified = false;
    if (statusBanner) {
      statusBanner.textContent = "사진 슬롯 구성을 불러오는 중입니다...";
    }

    init();

    async function init() {
      slotDefinitions = await loadSlotDefinitions(projectId, teamId, missionId);
      if (!slotDefinitions.length) {
        document.querySelector(".photo-layout").innerHTML =
          "<p>이 미션은 사진 업로드가 필요하지 않습니다.</p>";
        if (statusBanner) statusBanner.textContent = "이 미션은 사진 업로드가 필요하지 않습니다.";
        return;
      }

      slotDefinitions.forEach((slot) => {
        const column = slot.group === "special" ? rightColumn : leftColumn;
        const wrapper = document.createElement("div");
        wrapper.className = "photo-slot";
        wrapper.innerHTML = `
          <strong>${slot.label}</strong>
          <span class="slot-status" id="status-${slot.id}">대기</span>
          <input type="file" id="file-${slot.id}" accept="image/*,video/*">
          <label class="upload-btn" id="label-${slot.id}" for="file-${slot.id}">📤 업로드</label>
          <div class="preview" id="preview-${slot.id}">미리보기</div>
        `;
        column.appendChild(wrapper);
        slotElements.set(slot.id, wrapper);
      });
      if (statusBanner) {
        statusBanner.textContent = `📸 0/${slotDefinitions.length} 사진을 업로드했습니다.`;
      }

      const missionRef = ref(db, `uploads_meta/${projectId}/${teamId}/mission_${missionId}`);
      onValue(missionRef, (snapshot) => {
        const raw = snapshot.val() || {};
        const normalized = normalizeUploads(raw);

        slotDefinitions.forEach((slot) => {
          const preview = document.getElementById(`preview-${slot.id}`);
          const statusEl = document.getElementById(`status-${slot.id}`);
          const labelEl = document.getElementById(`label-${slot.id}`);
          if (!preview || !statusEl || !labelEl) return;
          const item = normalized[slot.id];
          if (!item) {
            preview.textContent = "미리보기";
            statusEl.textContent = "대기";
            statusEl.className = "slot-status";
            labelEl.textContent = "📤 업로드";
            labelEl.classList.remove("upload-btn--retry", "upload-btn--notify");
            slotStateCache.delete(slot.id);
            return;
          }
          applySlotState(slot, item, preview, statusEl, labelEl);
        });
        updateOverallStatus(normalized);
      });

      slotDefinitions.forEach((slot) => {
        const input = document.getElementById(`file-${slot.id}`);
        input.addEventListener("change", (event) => handleUpload(event, slot));
      });
      updateOverallStatus({});
    }

    async function loadSlotDefinitions(projectId, teamId, missionId) {
      try {
        const cfgRef = ref(db, `projects/${projectId}/teams/${teamId}/config/missions/${missionId}`);
        const snapshot = await get(cfgRef);
        const config = snapshot.val() || {};
        const missionNumber = Number(missionId);
        let photoSlots = Number(config.photoSlots) || 0;
        let specialSlots = Number(config.specialSlots) || 0;
        if (photoSlots <= 0 && specialSlots <= 0) return [];
        return buildSlotDefinitions(photoSlots, specialSlots);
      } catch (error) {
        console.error("슬롯 정의 불러오기 실패:", error);
        return [];
      }
    }

    function buildSlotDefinitions(photoSlots, specialSlots) {
      const defs = [];
      for (let i = 1; i <= photoSlots; i++) {
        defs.push({ id: `Photo${i}`, label: `Photo ${i}`, group: "photo" });
      }
      for (let i = 1; i <= specialSlots; i++) {
        defs.push({ id: `S${i}`, label: `S${i}`, group: "special" });
      }
      return defs;
    }

    async function handleUpload(event, slot) {
      let file = event.target.files?.[0];
      if (!file) return;

      const preview = document.getElementById(`preview-${slot.id}`);
      const statusEl = document.getElementById(`status-${slot.id}`);
      const labelEl = document.getElementById(`label-${slot.id}`);
      preview.textContent = "업로드 중...";
      statusEl.textContent = "업로드 중";
      labelEl.textContent = "⏳ 업로드 중";
      labelEl.classList.remove("upload-btn--retry", "upload-btn--notify");

      try {
        if (file.name.toLowerCase().endsWith(".heic")) {
          const blob = await heic2any({ blob: file, toType: "image/jpeg" });
          file = new File([blob], file.name.replace(/\.heic$/i, ".jpg"), { type: "image/jpeg" });
        }

        const extension = file.name.split(".").pop();
        const filename = `${teamId}_m${missionId}_${slot.id}_${Date.now()}.${extension}`;
        const storageRef = sRef(storage, `uploads/${projectId}/${teamId}/mission_${missionId}/${filename}`);

        await uploadBytes(storageRef, file);
        const url = await getDownloadURL(storageRef);

        // 먼저 업로드 메타데이터 저장
        await set(ref(db, `uploads_meta/${projectId}/${teamId}/mission_${missionId}/${slot.id}`), {
          url,
          type: file.type,
          slot: slot.id,
          label: slot.label,
          status: "pending",
          uploadedAt: Date.now(),
        });

        // 데이터 저장이 완료된 후 채팅 메시지 전송
        await push(ref(db, `chat/${projectId}/${teamId}`), {
          sender: teamId,
          text: `[사진 업로드] Mission ${missionId} ${slot.label}`,
          createdAt: serverTimestamp(),
        });

        preview.innerHTML = file.type.startsWith("video")
          ? `<video src="${url}" controls playsinline></video>`
          : `<img src="${url}" alt="${slot.label}">`;
        statusEl.textContent = "대기";
        statusEl.className = "slot-status slot-status--pending";
        labelEl.textContent = "📤 업로드";
        alert(`✅ ${slot.label} 업로드 완료`);
      } catch (error) {
        console.error("업로드 실패:", error);
        preview.textContent = "업로드 실패";
        alert("❌ 업로드 중 오류가 발생했습니다.");
      } finally {
        event.target.value = "";
      }
    }

    function normalizeUploads(raw) {
      const normalized = {};
      Object.entries(raw).forEach(([key, value]) => {
        if (!value) return;
        const slotId = value.slot || key;
        normalized[slotId] = value;
      });
      return normalized;
    }

    function applySlotState(slot, item, previewEl, statusEl, labelEl) {
      const status = item.status || "pending";
      const prev = slotStateCache.get(slot.id);
      const wrapper = slotElements.get(slot.id);
      if (status === "retry" && prev !== "retry") {
        announceRetry(slot, item);
      }
      if (wrapper) {
        wrapper.classList.toggle("photo-slot--retry", status === "retry");
        let retryNote = wrapper.querySelector(".slot-retry-note");
        if (!retryNote) {
          retryNote = document.createElement("div");
          retryNote.className = "slot-retry-note";
          wrapper.appendChild(retryNote);
        }
        if (status === "retry" && item.retryReason) {
          retryNote.textContent = `사유: ${item.retryReason}`;
          retryNote.style.display = "block";
        } else {
          retryNote.textContent = "";
          retryNote.style.display = "none";
        }
      }
      slotStateCache.set(slot.id, status);
      statusEl.textContent = statusLabel(status, item);
      statusEl.className = `slot-status slot-status--${status}`;
      labelEl.textContent = status === "retry" ? "🔁 재업로드" : "📤 업로드";
      labelEl.classList.toggle("upload-btn--retry", status === "retry");
      labelEl.classList.toggle("upload-btn--notify", status === "retry");
      previewEl.innerHTML = item.type?.startsWith("video")
        ? `<video src="${item.url}" controls playsinline></video>`
        : `<img src="${item.url}" alt="${slot.label}">`;
    }

    function statusLabel(status = "pending", item = {}) {
      switch (status) {
        case "approved":
          return "승인";
        case "retry":
          return item.retryReason ? `재도전 (${item.retryReason})` : "재도전";
        default:
          return "대기";
      }
    }

    function announceRetry(slot, item = {}) {
      const message = `[본부] ${slot.label} 재도전 요청${item.retryReason ? ` (${item.retryReason})` : ""}`;
      showToast(message, "warning");
    }

    function showToast(message, variant = "info", duration = 4500) {
      if (!alertArea) return;
      const toast = document.createElement("div");
      toast.className = `alert-toast alert-toast--${variant}`;
      toast.innerHTML = `<strong>${variant === "warning" ? "알림" : "안내"}</strong><span>${message}</span>`;
      alertArea.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-6px)";
        setTimeout(() => toast.remove(), 200);
      }, duration);
    }

    function updateOverallStatus(slotsMap = {}) {
      if (!statusBanner) return;
      const required = slotDefinitions.length;
      if (!required) {
        statusBanner.textContent = "이 미션은 사진 업로드가 필요하지 않습니다.";
        return;
      }
      const summary = slotDefinitions.map((slot) => slotsMap[slot.id]);
      const uploaded = summary.filter((item) => item?.url).length;
      const approved = summary.filter((item) => item?.status === "approved").length;
      const hasRetry = summary.some((item) => item?.status === "retry");
      if (approved !== required) {
        approvalNotified = false;
      }
      if (approved === required && required > 0) {
        statusBanner.innerHTML = "<strong>🎉 축하합니다! 미션 성공</strong><br>HQ에서 승인을 완료했습니다. 다음 미션을 진행하세요.";
        if (!approvalNotified) {
          approvalNotified = true;
          showToast("축하합니다! 사진이 승인되었습니다. 미션을 완료했습니다.", "info", 3500);
        }
        return;
      }
      if (hasRetry) {
        statusBanner.textContent = "⚠️ 재도전 요청이 있습니다. 사유를 확인하고 사진을 다시 업로드하세요.";
        return;
      }
      if (uploaded === required && required > 0) {
        statusBanner.textContent = "📮 사진을 모두 제출하였습니다. 승인 대기중입니다.";
        return;
      } else {
        statusBanner.textContent = `📸 ${uploaded}/${required} 사진을 업로드했습니다.`;
      }
    }
  </script>
</body>
</html>
