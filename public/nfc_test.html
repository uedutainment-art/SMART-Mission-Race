<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFC 테스트 | SMART Mission Race</title>
  <link rel="stylesheet" href="./css/style.css" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .nfc-container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .nfc-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .nfc-header h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 10px;
    }
    .nfc-header p {
      color: #666;
      font-size: 14px;
    }
    .nfc-status {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
    }
    .status-indicator {
      width: 80px;
      height: 80px;
      margin: 0 auto 15px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      transition: all 0.3s ease;
    }
    .status-indicator.ready { background: #e3f2fd; }
    .status-indicator.scanning { background: #fff3cd; animation: pulse 1.5s infinite; }
    .status-indicator.success { background: #d4edda; }
    .status-indicator.error { background: #f8d7da; }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }
    
    .status-text {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }
    .status-detail {
      font-size: 14px;
      color: #666;
    }
    
    .nfc-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    button {
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .btn-secondary {
      background: #f8f9fa;
      color: #333;
      border: 2px solid #dee2e6;
    }
    .btn-secondary:hover { background: #e9ecef; }
    
    .nfc-data {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 15px;
      margin-top: 20px;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .nfc-data pre {
      margin: 0;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    .team-info {
      background: #e3f2fd;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }
    
    .team-info h3 {
      margin: 0 0 10px 0;
      color: #1976d2;
      font-size: 18px;
    }
    
    .team-info p {
      margin: 5px 0;
      color: #333;
    }
    
    .info-badge {
      display: inline-block;
      background: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="nfc-container">
    <div class="nfc-header">
      <h1>🔖 NFC 태그 테스트</h1>
      <p>NFC 기능을 안전하게 실험하는 공간입니다</p>
    </div>

    <div class="nfc-status">
      <div class="status-indicator ready" id="statusIcon">📱</div>
      <div class="status-text" id="statusText">준비됨</div>
      <div class="status-detail" id="statusDetail">NFC 태그를 스캔하려면 아래 버튼을 누르세요</div>
    </div>

    <div class="nfc-actions">
      <button class="btn-primary" id="scanBtn">
        📡 NFC 태그 스캔
      </button>
      <button class="btn-secondary" id="writeBtn" disabled>
        ✏️ NFC 태그에 쓰기
      </button>
      <button class="btn-secondary" id="clearBtn">
        🗑️ 데이터 초기화
      </button>
    </div>

    <div id="teamInfo" style="display: none;" class="team-info">
      <h3>인식된 팀 정보</h3>
      <p><strong>팀 ID:</strong> <span id="teamId">-</span></p>
      <p><strong>팀 번호:</strong> <span id="teamNumber">-</span></p>
      <p><strong>팀 이름:</strong> <span id="teamName">-</span></p>
      <div class="info-badge">✅ 데이터베이스 연동 준비됨</div>
    </div>

    <div class="nfc-data" id="nfcData" style="display: none;">
      <pre id="dataContent"></pre>
    </div>
  </div>

  <script type="module">
    import { db, ref, set, get } from './js/firebase_config.js';

    const statusIcon = document.getElementById('statusIcon');
    const statusText = document.getElementById('statusText');
    const statusDetail = document.getElementById('statusDetail');
    const scanBtn = document.getElementById('scanBtn');
    const writeBtn = document.getElementById('writeBtn');
    const clearBtn = document.getElementById('clearBtn');
    const teamInfo = document.getElementById('teamInfo');
    const nfcData = document.getElementById('nfcData');
    const dataContent = document.getElementById('dataContent');

    let lastScannedData = null;

    // NFC 지원 확인
    if ('NDEFReader' in window) {
      statusDetail.textContent = 'NFC가 지원되는 브라우저입니다';
    } else {
      statusText.textContent = '⚠️ NFC 미지원';
      statusDetail.textContent = 'Chrome for Android 89+ 또는 지원 브라우저가 필요합니다';
      scanBtn.disabled = true;
      writeBtn.disabled = true;
    }

    // NFC 스캔
    scanBtn.addEventListener('click', async () => {
      if (!('NDEFReader' in window)) {
        alert('NFC를 지원하지 않는 브라우저입니다.');
        return;
      }

      try {
        const ndef = new NDEFReader();
        
        statusIcon.className = 'status-indicator scanning';
        statusIcon.textContent = '🔍';
        statusText.textContent = '스캔 중...';
        statusDetail.textContent = 'NFC 태그를 가까이 대주세요';
        scanBtn.disabled = true;

        await ndef.scan();
        console.log('NFC 스캔 시작됨');

        ndef.addEventListener('reading', ({ message, serialNumber }) => {
          statusIcon.className = 'status-indicator success';
          statusIcon.textContent = '✅';
          statusText.textContent = '태그 인식 성공!';
          statusDetail.textContent = `Serial: ${serialNumber}`;

          let teamData = null;

          for (const record of message.records) {
            const decoder = new TextDecoder(record.encoding || 'utf-8');
            const text = decoder.decode(record.data);
            
            console.log('NFC 레코드:', {
              recordType: record.recordType,
              mediaType: record.mediaType,
              data: text
            });

            // 팀 데이터 파싱 시도
            try {
              const parsed = JSON.parse(text);
              if (parsed.teamId || parsed.team) {
                teamData = {
                  teamId: parsed.teamId || parsed.team,
                  teamNumber: parsed.teamNumber || parsed.number,
                  teamName: parsed.teamName || parsed.name || ''
                };
              }
            } catch (e) {
              // JSON이 아닌 경우 무시
            }

            dataContent.textContent = JSON.stringify({
              serialNumber,
              recordType: record.recordType,
              mediaType: record.mediaType,
              data: text
            }, null, 2);
          }

          nfcData.style.display = 'block';
          lastScannedData = { serialNumber, teamData };

          // 팀 정보 표시
          if (teamData) {
            document.getElementById('teamId').textContent = teamData.teamId;
            document.getElementById('teamNumber').textContent = teamData.teamNumber || '-';
            document.getElementById('teamName').textContent = teamData.teamName || '-';
            teamInfo.style.display = 'block';

            // Firebase에 NFC 스캔 로그 저장 (선택)
            saveNFCScanLog(teamData, serialNumber);
          }

          scanBtn.disabled = false;
          writeBtn.disabled = false;
        });

        ndef.addEventListener('readingerror', () => {
          statusIcon.className = 'status-indicator error';
          statusIcon.textContent = '❌';
          statusText.textContent = '읽기 오류';
          statusDetail.textContent = '태그를 다시 시도하세요';
          scanBtn.disabled = false;
        });

      } catch (error) {
        console.error('NFC 스캔 오류:', error);
        statusIcon.className = 'status-indicator error';
        statusIcon.textContent = '❌';
        statusText.textContent = '오류 발생';
        statusDetail.textContent = error.message;
        scanBtn.disabled = false;
        alert(`NFC 오류: ${error.message}`);
      }
    });

    // NFC 쓰기
    writeBtn.addEventListener('click', async () => {
      if (!('NDEFReader' in window)) {
        alert('NFC를 지원하지 않는 브라우저입니다.');
        return;
      }

      const teamId = prompt('팀 ID를 입력하세요 (예: Team1)');
      if (!teamId) return;

      const teamNumber = prompt('팀 번호를 입력하세요 (예: 1)');
      const teamName = prompt('팀 이름을 입력하세요 (선택)');

      const teamData = {
        teamId: teamId,
        teamNumber: teamNumber ? parseInt(teamNumber) : null,
        teamName: teamName || ''
      };

      try {
        const ndef = new NDEFReader();
        
        statusIcon.className = 'status-indicator scanning';
        statusIcon.textContent = '✏️';
        statusText.textContent = '쓰기 준비 중...';
        statusDetail.textContent = 'NFC 태그를 가까이 대주세요';
        writeBtn.disabled = true;

        await ndef.write({
          records: [
            { recordType: "text", data: JSON.stringify(teamData) }
          ]
        });

        statusIcon.className = 'status-indicator success';
        statusIcon.textContent = '✅';
        statusText.textContent = '쓰기 성공!';
        statusDetail.textContent = '팀 정보가 태그에 저장되었습니다';
        
        alert('NFC 태그에 팀 정보를 성공적으로 저장했습니다!');
        writeBtn.disabled = false;

      } catch (error) {
        console.error('NFC 쓰기 오류:', error);
        statusIcon.className = 'status-indicator error';
        statusIcon.textContent = '❌';
        statusText.textContent = '쓰기 실패';
        statusDetail.textContent = error.message;
        writeBtn.disabled = false;
        alert(`NFC 쓰기 오류: ${error.message}`);
      }
    });

    // 데이터 초기화
    clearBtn.addEventListener('click', () => {
      statusIcon.className = 'status-indicator ready';
      statusIcon.textContent = '📱';
      statusText.textContent = '준비됨';
      statusDetail.textContent = 'NFC 태그를 스캔하려면 아래 버튼을 누르세요';
      teamInfo.style.display = 'none';
      nfcData.style.display = 'none';
      dataContent.textContent = '';
      lastScannedData = null;
      writeBtn.disabled = true;
    });

    // Firebase에 NFC 스캔 로그 저장
    async function saveNFCScanLog(teamData, serialNumber) {
      try {
        const logRef = ref(db, `nfc_test/scans/${Date.now()}`);
        await set(logRef, {
          teamId: teamData.teamId,
          teamNumber: teamData.teamNumber,
          teamName: teamData.teamName,
          serialNumber: serialNumber,
          timestamp: Date.now(),
          userAgent: navigator.userAgent
        });
        console.log('NFC 스캔 로그 저장됨');
      } catch (error) {
        console.error('로그 저장 실패:', error);
      }
    }
  </script>
</body>
</html>
